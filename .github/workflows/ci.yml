name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start broker and simulator
        run: docker compose up --build -d
      - name: Receive a meas message
        run: docker compose exec -T mosquitto mosquitto_sub -t 'libre-solar/bms/+/meas' -C 1 -W 30
      - if: always()
        run: docker compose logs && docker compose down -v
