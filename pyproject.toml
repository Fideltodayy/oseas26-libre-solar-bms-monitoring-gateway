[project]
name = "bms-gateway"
version = "0.1.0"
description = "Open remote monitoring gateway for the Libre Solar BMS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.0",
  "jsonschema[format-nongpl]>=4.18",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bms-simulator = "bms_gateway.simulator:main"
bms-gateway = "bms_gateway.gateway:main"
bms-relay = "bms_gateway.relay:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bms_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
